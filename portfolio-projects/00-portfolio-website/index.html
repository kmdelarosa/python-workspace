<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Maintenance — Portfolio</title>
    <meta name="description" content="This portfolio is currently under maintenance." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f172a;
            --bg2: #1e293b;
            --accent: #3b82f6;
            --accent2: #60a5fa;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
            --card: #1e293b;
            --radius: 10px;
            --font: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            line-height: 1.6;
        }

        .maintenance {
            text-align: center;
            max-width: 560px;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.12);
            color: var(--accent2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .icon {
            font-size: 3.4rem;
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 16px;
        }

        h1 span {
            color: var(--accent);
        }

        p.lead {
            color: var(--muted);
            font-size: 1.05rem;
            margin-bottom: 36px;
        }

        .contact-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 28px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .contact-card .label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .contact-card a {
            color: var(--accent2);
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
        }

        .contact-card a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 40px;
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <main class="maintenance">
        <span class="badge">Under Maintenance</span>
        <div class="icon">🛠️</div>
        <h1>We'll be back<br><span>shortly.</span></h1>
        <p class="lead">
            This portfolio is currently under construction while we make some
            improvements. Thanks for your patience — please check back soon.
        </p>
        <div class="contact-card">
            <span class="label">For inquiries &amp; details</span>
            <a href="mailto:kmdlrosa@gmail.com">kmdlrosa@gmail.com</a>
        </div>
        <footer>&copy; 2026 · All rights reserved.</footer>
    </main>
</body>

</html>
